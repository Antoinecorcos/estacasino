name: Vérifications

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Compilation
        run: npm run build
      - name: Déploiement à blanc (configuration Cloudflare)
        run: npx wrangler deploy --dry-run --outdir dist/worker
